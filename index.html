<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculatrice Premium - Liquid Glass</title>
    <style>
      /* Fond esthétique de la page (dégradé orangé) */
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background:
          linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%),
          linear-gradient(45deg, #ff7e5f 0%, #feb47b 100%);
        background-blend-mode: screen;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden; /* Pour l'effet de vague en fond si besoin */
      }

      /* Style de la calculatrice - Effet Liquid Glass */
      .calculator {
        /* Légèrement plus sombre et bleuté pour contraster avec le fond orange */
        background: rgba(230, 240, 255, 0.2);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 30px;
        padding: 30px;
        /* Ombre portée plus douce et diffuse */
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        width: 340px;
        position: relative; /* Pour positionner les pseudo-éléments "liquides" */
        overflow: hidden; /* Pour contenir l'effet liquide */
      }

      /* Effet "Liquide" - Pseudo-éléments */
      .calculator::before,
      .calculator::after {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        border-radius: 40%;
        animation: liquid-swim 15s infinite linear;
        z-index: -1; /* Derrière les boutons */
      }

      .calculator::before {
        background-color: rgba(238, 238, 238, 0.253);
        animation-delay: -5s;
      }

      .calculator::after {
        background-color: rgba(255, 255, 255, 0.05);
        animation-delay: -10s;
      }

      @keyframes liquid-swim {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(5%, 5%) rotate(180deg);
        }
        100% {
          transform: translate(0, 0) rotate(360deg);
        }
      }

      /* Écran de la calculatrice */
      .screen {
        width: 100%;
        height: 80px;
        background: rgba(255, 255, 255, 0.466); /* Légèrement plus opaque */
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        font-size: 2.5rem;
        color: #333; /* Texte plus sombre pour lisibilité */
        text-align: right;
        padding: 15px 20px;
        box-sizing: border-box;
        margin-bottom: 25px;
        outline: none;
        /* Ombre interne pour l'effet de profondeur */
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.295);
      }

      /* Grille des boutons */
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      /* Style des boutons - Plus nets */
      button {
        padding: 22px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-size: 1.3rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.4); /* Plus clair */
        color: #444; /* Texte plus sombre */
      }

      button:hover {
        background: rgba(255, 255, 255, 0.6);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      button:active {
        transform: translateY(0px) scale(1);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      /* Boutons spéciaux */
      .operator {
        background: #ff967880; /* Couleur orangée distincte */
        color: #fff;
      }

      .operator:hover {
        background: #ff9678;
      }

      .equal {
        background: #ff8e75; /* Plus vif */
        grid-column: span 2;
        color: white;
        border: none;
        box-shadow: 0 6px 20px rgba(255, 142, 117, 0.5);
      }

      .equal:hover {
        background: #ff7c60;
        box-shadow: 0 8px 25px rgba(255, 142, 117, 0.6);
      }

      .clear {
        background: #ff5a5080;
        color: #fff;
      }
      .clear:hover {
        background: rgba(255, 90, 80, 0.6);
      }

      /* Fenêtre Pop-up (Modale Paywall) - Inchangée car déjà contrastée */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 100; /* Assure d'être au-dessus */
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal {
        background: white;
        padding: 40px;
        border-radius: 25px;
        text-align: center;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        transform: scale(0.7);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Effet rebond */
      }

      .modal-overlay.active .modal {
        transform: scale(1);
      }

      .modal h2 {
        color: #ff7e5f;
        margin-top: 0;
        font-size: 1.45rem;
      }

      .modal p {
        color: #666;
        line-height: 1.6;
        margin-bottom: 30px;
        font-size: 1.1rem;
      }

      /* Boutons de la modale */
      .btn-stripe {
        background: #635bff;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(99, 91, 255, 0.3);
      }

      .btn-stripe:hover {
        background: #4b45cc;
        box-shadow: 0 6px 15px rgba(99, 91, 255, 0.4);
        transform: translateY(-2px);
      }

      .btn-close {
        background: none;
        color: #999;
        font-size: 1rem;
        text-decoration: underline;
        border: none;
        cursor: pointer;
        transition: color 0.2s;
      }
      .btn-close:hover {
        color: #666;
      }
    </style>
  </head>
  <body>
    <!-- Calculatrice -->
    <div class="calculator">
      <input type="text" class="screen" id="screen" readonly value="0" />
      <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('.')">.</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('0')">0</button>

        <!-- Le bouton égal déclenche le paywall -->
        <button class="equal" onclick="triggerPaywall()">=</button>
      </div>
    </div>

    <!-- Pop-up d'abonnement (Paywall) -->
    <div class="modal-overlay" id="paywall">
      <div class="modal">
        <h2>👑 Premium Calculation Required 👑</h2>
        <p>
          The result of this complex calculation requires exceptional
          algorithmic precision. <br /><br />Subscribe to unlock the unlimited
          power of our calculation engine.
        </p>

        <!-- Lien vers Stripe -->
        <button class="btn-stripe" onclick="redirectToStripe()">
          Activate my Premium access
        </button>

        <button class="btn-close" onclick="closePaywall()">
          I guess i will do it with my head
        </button>
      </div>
    </div>

    <script>
      const screen = document.getElementById("screen");
      const paywall = document.getElementById("paywall");

      // Ajouter des chiffres ou opérateurs sur l'écran
      function appendValue(value) {
        if (screen.value === "0" && value !== ".") {
          screen.value = value;
        } else {
          screen.value += value;
        }
      }

      // Effacer l'écran
      function clearScreen() {
        screen.value = "0";
      }

      // Déclencher le paywall au clic sur "="
      function triggerPaywall() {
        // Optionnel : Vous pourriez même bloquer le calcul si l'écran est vide ou '0'
        // if (screen.value === '0' || screen.value === '') return;
        paywall.classList.add("active");
      }

      // Fermer la modale
      function closePaywall() {
        paywall.classList.remove("active");
      }

      // Redirection vers Stripe
      function redirectToStripe() {
        // REMPLACEZ CE LIEN PAR VOTRE LIEN STRIPE CHECKOUT VALIDE
        window.location.href =
          "https://buy.stripe.com/test_00w7sN7Ik03s1rQ3s23oA01";
      }

      // Fermer la modale en cliquant à l'extérieur (sur l'overlay)
      paywall.addEventListener("click", function (event) {
        if (event.target === paywall) {
          closePaywall();
        }
      });
    </script>
  </body>
</html>
